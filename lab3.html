<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderly</title>
    <style>
        body{
            background-image:linear-gradient(rgba(174, 212, 198, 0.55), rgba(113, 88, 62, 0.65)), url(https://images.wallpaperscraft.com/image/single/eiffel_tower_paris_buildings_117712_2560x1440.jpg);
            background-size: cover;  
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        header{
            width:100%;
            /* position: fixed; */
       
        }
        .container-fluid{
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding:15px 40px ;
           color: rgb(95, 69, 35);
        }
        .container-fluid a{
            color:inherit;
        }
        ul{
            list-style-type: none;
        }
        ul li{
            display: inline;
            margin-right: 10px;
            padding:10px 5px;
        }
        ul li:hover{
            background-color: rgb(118, 148, 171);
        }
        ul li a{
            text-decoration: none;
            /* color: white; */
            font-family: "Google Sans", sans-serif;
        }
        .web{
            display: flex;
            justify-content:center;
            flex-direction: column;
            text-align: center;
            height: 50vh;           
            display: flex;
            color: #f5e6c8;       
        }
        .web h2{
            font-size: 50px;
            font-weight: bolder;
             margin: 0 0 5px; 
        }
        .web p{
            font-size: 35px;
            font-weight: bolder;
        }
        .button{
            padding: 30px;
            background-color: rgba(225, 143, 113, 0.922);
            border-radius: 30px;
            font-weight: bolder;
        }
            .web .button {
            margin: 25px auto 0; 
            width: fit-content;          
            padding: 15px 40px;
            background-color: #e08e72;
            color: #f5e6c8;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        .web .button:hover {
        background-color: #b5563a;       
        }
    </style>
</head>
<body>
    <header>
        <div class="container-fluid">
            <h1>Wonderly</h1>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
        </div>
    </header>
    <div class="web">
        <h2>Welcome to our website!</h2>
        <p>We make your trip happier</p>
        <p class="button">Learn more >></p>
    </div>
</body>
</html>
